# GitLab CI/CD Pipeline for w26-presentation-scheduler

image: docker:latest
stages:
  - build
  - deploy
variables:
  DOCKER_DRIVER: overlay2
  CI_CONFIG_HASH: 4b04fe7223044de53a1b45c443f31cf55dc727fbe4dd1cf24fff670d0d11267e
.before_script_common:
  variables: {}
  before_script:
    - apk add --no-cache curl bash
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
    - |-
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        echo "Using docker-compose.main.yaml"
        cp -rf .secure_files/docker-compose.main.yaml docker-compose.yml
        ls -la
      elif [ "$CI_COMMIT_BRANCH" = "dev" ]; then
        echo "Using docker-compose.dev.yaml"
        cp -rf .secure_files/docker-compose.dev.yaml docker-compose.yml
      else
        echo "Unsupported branch: $CI_COMMIT_BRANCH"
        exit 1
      fi
build_main:
  extends: .before_script_common
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
    - when: never
  tags:
    - HSS
  script:
    - docker compose -f docker-compose.yml build main --no-cache
    - docker tag w26-presentation-scheduler-2wogzy-main w26-presentation-scheduler-2wogzy-main:$CI_COMMIT_BRANCH
    - docker save w26-presentation-scheduler-2wogzy-main:$CI_COMMIT_BRANCH -o w26-presentation-scheduler-2wogzy-main.tar
  artifacts:
    paths:
      - w26-presentation-scheduler-2wogzy-main.tar
deploy_main:
  extends: .before_script_common
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
    - when: never
  tags:
    - HSS
  needs:
    - build_main
  script:
    - docker-compose rm -s -f main || true
    - docker rmi w26-presentation-scheduler-2wogzy-main:$CI_COMMIT_BRANCH || true
    - docker load -i w26-presentation-scheduler-2wogzy-main.tar
    - docker-compose up -d main
