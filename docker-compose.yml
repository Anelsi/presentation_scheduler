services:
  app:
    build: .
    container_name: presentation_scheduler_app
    ports:
      - "${APP_PORT:-3000}:80"
    env_file:
      - .env
    environment:
      APP_BASE_URL: ${DOCKER_APP_BASE_URL:-http://localhost:3000}
      DB_HOST: ${DOCKER_DB_HOST:-db}
      DB_PORT: ${DOCKER_DB_PORT:-3306}
      DB_DATABASE: ${MYSQL_DATABASE:-presentation_scheduler}
      DB_USERNAME: ${MYSQL_USER:-presentation_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-presentation_password}
    volumes:
      - ./:/var/www/html
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: presentation_scheduler_db
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-presentation_scheduler}
      MYSQL_USER: ${MYSQL_USER:-presentation_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-presentation_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-root_password}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
